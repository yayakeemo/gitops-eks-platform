name: Build and push image

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Install dependencies
        run: make install
      - name: Run tests
        run: make test
      - name: Build image
        run: make build
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      - name: Scan image
        run: make scan
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        run: |
          docker tag gitops-demo:dev ghcr.io/${{ github.repository_owner }}/gitops-eks-platform:latest
          docker tag gitops-demo:dev ghcr.io/${{ github.repository_owner }}/gitops-eks-platform:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/gitops-eks-platform:latest
          docker push ghcr.io/${{ github.repository_owner }}/gitops-eks-platform:${{ github.sha }}

      - name: Update deployment image tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          sed -i "s/image: gitops-demo:.*/image: gitops-demo:${SHORT_SHA}/g" k8s/base/deployment.yaml

      - name: Commit and push image update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/base/deployment.yaml
          git commit -m "Update deployment image to $(git rev-parse --short HEAD) [skip ci]" || echo "No changes to commit"
          git push origin main
